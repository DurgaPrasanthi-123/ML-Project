services:
  - type: web
    name: phishing-url-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: phishing-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://phishing-url-frontend.onrender.com"]'

databases:
  - name: phishing-db
    plan: free
    databaseName: phishing
    user: phishing
